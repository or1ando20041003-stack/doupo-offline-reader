name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Determine repository base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name_lower="${repository_name,,}"
          owner_pages_name="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          if [[ "$repository_name_lower" == "$owner_pages_name" ]]; then
            base_path="/"
          else
            base_path="/${repository_name}/"
          fi
          echo "VITE_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "EXPECTED_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "Building GitHub Pages site at ${base_path}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production PWA
        run: npm run build

      - name: Verify deployment artifact and privacy
        run: npm run verify:deploy

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
